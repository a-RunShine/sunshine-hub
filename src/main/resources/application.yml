spring:
  application:
    name: sunshine-fps

  datasource:
    url: jdbc:mysql://localhost:33306/sunshine_fps?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: sunshine
    hikari:
      maximum-pool-size: 20

  data:
    redis:
      host: localhost
      port: 36379

  session:
    store-type: redis
    timeout: 30m

  # 迁移脚本按模块拆分，脚本里的表前缀标明归属：t_identity_、t_catalog_ 等
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

server:
  port: 8080
  shutdown: graceful

logging:
  level:
    com.sunshinefps: debug
