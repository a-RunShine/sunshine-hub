        freight:
          type: integer
          format: int64
          description: 运费，单位分。只对实体部分计费
        payDeadline:
          type: [string, 'null']
          format: date-time
        secondsLeft:
          type: [integer, 'null']
          description: 服务端算好的剩余支付秒数
        serverTime:
          type: string
          format: date-time
          description: 服务端当前时间，前端用它算付款倒计时的偏移
        closeReason:
          type: [string, 'null']
          enum: [TIMEOUT, CANCELLED, null]
        items:
          type: array
