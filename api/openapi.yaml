components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: SESSION
      description: >-
        登录后由服务端 Set-Cookie 下发。会话存在 Redis，登出或封号即刻失效。
        写请求（POST/PUT/PATCH/DELETE）还需带 X-Requested-With 头做 CSRF 防护，
        支付与退款回调除外，它们靠验签。
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OrderNo:
      name: orderNo
      in: path
      required: true
      schema:
        type: string
    RefundId:
      name: refundId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    FulfillmentId:
      name: fulfillmentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  responses:
    BadRequest:
      description: 参数不合法。code：BAD_REQUEST
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 没登录或会话已过期。code：UNAUTHORIZED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 登录了但没权限。code：FORBIDDEN
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 触发限流。code：RATE_LIMITED
      headers:
        Retry-After:
          schema:
            type: integer
          description: 多少秒后可以重试
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ErrorCode:
      type: string
      description: 业务错误码，与 src/main/java/com/sunshinefps/shared/ErrorCode.java 一一对应。新增错误码必须两边同步
      enum:
        - UNAUTHORIZED
        - FORBIDDEN
        - REAL_NAME_REQUIRED
        - REAL_NAME_ALREADY_SET
        - USERNAME_TAKEN
        - BAD_CREDENTIALS
        - PRODUCT_NOT_FOUND
        - CATEGORY_NOT_FOUND
        - CATEGORY_IN_USE
        - CAMPAIGN_NOT_FOUND
        - CAMPAIGN_NOT_STARTED
        - CAMPAIGN_ENDED
        - QUOTA_EXCEEDED
        - ALREADY_PURCHASED
        - PURCHASE_COOLDOWN
        - SOLD_OUT
        - UNIT_POOL_INCONSISTENT
        - RATE_LIMITED
        - ORDER_NOT_FOUND
        - ORDER_NOT_PAYABLE
        - ORDER_NOT_CANCELLABLE
        - STOCK_INSUFFICIENT
        - ADDRESS_REQUIRED
        - ADDRESS_NOT_FOUND
        - ADDRESS_LIMIT_EXCEEDED
        - ADDRESS_IN_USE
        - FULFILLMENT_NOT_FOUND
        - FULFILLMENT_NOT_SIGNABLE
        - REFUND_NOT_FOUND
        - REFUND_NOT_ALLOWED
        - REFUND_ALREADY_OPEN
        - ANNOUNCEMENT_NOT_FOUND
        - EVENT_NOT_FOUND
        - BAD_REQUEST
        - INTERNAL_ERROR
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 可直接展示给用户的中文文案
        data:
          description: 通常为 null，需要附带上下文时放这里
          type: [object, 'null']
    ProductKind:
      type: string
      enum: [VIRTUAL, PHYSICAL]
    Category:
      type: object
      required: [id, name, sortOrder]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        sortOrder:
          type: integer
          description: 列表按该值升序
    CategoryInput:
      type: object
      required: [name, sortOrder]
      properties:
        name:
          type: string
        sortOrder:
          type: integer
    ProductSummary:
      type: object
      required: [id, name, kind, categoryId, coverUrl, minPrice, limited]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          $ref: '#/components/schemas/ProductKind'
        categoryId:
          type: integer
          format: int64
          description: 所属分类的 id
        coverUrl:
          type: string
        minPrice:
          type: integer
          format: int64
          description: 所有规格里的最低价，单位分
        limited:
          type: boolean
          description: 限量商品会有 Unit 与收藏编号
    ProductPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
    ProductDetail:
      type: object
      required: [id, name, kind, categoryId, description, coverUrl, skus, limited]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          $ref: '#/components/schemas/ProductKind'
        categoryId:
          type: integer
          format: int64
          description: 所属分类的 id
        description:
          type: string
        coverUrl:
          type: string
        limited:
          type: boolean
        totalLimit:
          type: [integer, 'null']
          description: 限量总数。不限量时为 null
        purchaseLimit:
          type: [integer, 'null']
          description: 商品级限购额度，只服务虚拟道具「一个账号一件」这一套，按账号判定；与限时抢购的本场额度 campaignLimit（按实名、按场配置）是两条独立规则，不合并、不互相复制。不限购时为 null。
        skus:
          type: array
          items:
            $ref: '#/components/schemas/Sku'
    ProductInput:
      type: object
      required: [name, kind, categoryId, description, coverUrl]
      properties:
        name:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/ProductKind'
        categoryId:
          type: integer
          format: int64
          description: 所属分类的 id
        description:
          type: string
        coverUrl:
          type: string
        totalLimit:
          type: [integer, 'null']
        purchaseLimit:
          type: [integer, 'null']
    Sku:
      type: object
      required: [id, name, price, stock]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: 虚拟道具是「默认」，实体周边是「黑色 L 码」这种
        attrs:
          type: object
          additionalProperties:
            type: string
          description: 规格属性，虚拟道具为空对象
        price:
          type: integer
          format: int64
          description: 单位分
        stock:
          type: integer
    SkuInput:
      type: object
      required: [name, price, stock]
      properties:
        name:
          type: string
        attrs:
          type: object
          additionalProperties:
            type: string
        price:
          type: integer
          format: int64
        stock:
          type: integer
          minimum: 0
    CampaignType:
      type: string
      enum: [FLASH, NORMAL, DISCOUNT]
    CampaignSummary:
      type: object
      required: [id, name, type, productId, productName, startAt, coverUrl]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          $ref: '#/components/schemas/CampaignType'
        productId:
          type: integer
          format: int64
        productName:
          type: string
        startAt:
          type: string
          format: date-time
        coverUrl:
          type: string
    CampaignDetail:
      description: |
        场次详情。按 type 区分两种形状，前端先按 type 收窄，再读配额或折扣价。

        `reserved`、限时抢购形状里的 `remainingCampaignLimit` 与 `cooldownUntil` 属于购买人专属字段：按当前购买人计算，从共享场次缓存读出公共数据之后再叠加，不得写入共享缓存，避免不同购买人互相看到对方的预约状态、剩余额度与冷却时刻。未登录（匿名）访问时这些字段为 `null`，与 `false`、`0` 等已知零值区分开：`null` 表示「不知道」，`false` 表示已登录且未预约，`0` 表示本场额度用尽。
      oneOf:
        - $ref: '#/components/schemas/FlashCampaignDetail'
        - $ref: '#/components/schemas/SimpleCampaignDetail'
      discriminator:
        propertyName: type
        mapping:
          FLASH: '#/components/schemas/FlashCampaignDetail'
          NORMAL: '#/components/schemas/SimpleCampaignDetail'
          DISCOUNT: '#/components/schemas/SimpleCampaignDetail'
    FlashCampaignDetail:
      type: object
      description: 限时抢购详情。配额与本场额度必填；售罄由 allocation.available 表达，不是 status 终态，回流释放后可恢复（ADR-0003）。
      required: [id, name, type, productId, startAt, status, serverTime, allocation, campaignLimit, remainingCampaignLimit, cooldownUntil, reserved]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
          enum: [FLASH]
        productId:
          type: integer
          format: int64
        startAt:
          type: string
          format: date-time
        endAt:
          type: [string, 'null']
          format: date-time
        status:
          type: string
          enum: [UPCOMING, ONGOING, ENDED]
        serverTime:
          type: string
          format: date-time
          description: 服务端当前时间，前端用它算与本地时间的偏移
        allocation:
          $ref: '#/components/schemas/Allocation'
        campaignLimit:
          type: integer
          minimum: 1
          description: 本场额度：一个 Purchaser 在本场最多可购几件，按实名计算，额度只在本场内计、不跨场累计；运营发布该场时设定，允许大于 1 件。
        remainingCampaignLimit:
          type: [integer, 'null']
          description: 当前购买人在本场还剩多少件可购（剩余本场额度）。按实名计算，同一实名下的不同账号看到一致结果；只反映本场，不跨场累计。`null` = 匿名（未登录，不知道）；`0` = 本场额度用尽。
        cooldownUntil:
          type: [string, 'null']
          format: date-time
          description: |
            当前购买人在本商品上的购买冷却到期时刻；`null` = 当前购买人不在本商品的冷却中。

            - **匿名（未登录）时返回 `null`**：不下发冷却态，与 `remainingCampaignLimit`、`reserved` 的匿名口径一致；未登录不预判冷却，按钮保持可点。
            - **按商品计、跨场生效**（ADR-0013 / D4）：冷却挂 `productId`、不挂 `campaignId`，同一商品在不同场次的详情返回相同的 `cooldownUntil`。
            - **与本场额度是两套互不替代的约束**：`remainingCampaignLimit` 按实名、按场独立计，只在本场内有效；本字段按商品、跨场累计。两者作用域不同是有意的不对称（ADR-0012 vs ADR-0013），不要当成 bug 抹平成同一把尺子。
            - 只表达到期时刻：不表达未支付次数，也不表达冷却档位；7 天滚动窗口的计数结构仍待设计，不在本契约范围。
        reserved:
          type: [boolean, 'null']
          description: 当前购买人是否已预约。未登录（匿名）时为 `null`（不知道）；`false` = 已登录且未预约。
    SimpleCampaignDetail:
      type: object
      description: 普通售卖／折扣场详情。不承载配额；折扣价在 discountPrice。
      required: [id, name, type, productId, startAt, status, serverTime, reserved]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
          enum: [NORMAL, DISCOUNT]
        productId:
          type: integer
          format: int64
        startAt:
          type: string
          format: date-time
        endAt:
          type: [string, 'null']
          format: date-time
        status:
          type: string
          enum: [UPCOMING, ONGOING, ENDED]
        serverTime:
          type: string
          format: date-time
          description: 服务端当前时间，前端用它算与本地时间的偏移
        discountPrice:
          type: [integer, 'null']
          format: int64
        reserved:
          type: [boolean, 'null']
          description: 当前购买人是否已预约。未登录（匿名）时为 `null`（不知道）；`false` = 已登录且未预约。
    CampaignInput:
      type: object
      required: [name, type, productId]
      properties:
        name:
          type: string
          maxLength: 100
        type:
          $ref: '#/components/schemas/CampaignType'
        productId:
          type: integer
          format: int64
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        discountPrice:
          type: integer
          format: int64
        campaignLimit:
          type: integer
          minimum: 1
          description: 本场额度（Campaign Limit）：本场每人最多几件，仅对限时抢购（FLASH）场次有意义；未提供时服务端按 1 件处理，允许大于 1 件。普通售卖与折扣场忽略该字段。
    Allocation:
      type: object
      description: 恒等式 available + occupied + pendingRepool + sold = total
      required: [total, available, occupied, pendingRepool, sold]
      properties:
        total:
          type: integer
        available:
          type: integer
        occupied:
          type: integer
          description: 被未支付订单占着
        pendingRepool:
          type: integer
          description: 已关单但还没到可售时间
        sold:
          type: integer
    ClaimResult:
      type: object
      required: [orderNo, collectibleNumber, payDeadline, serverTime]
      properties:
        orderNo:
          type: string
        collectibleNumber:
          type: string
          description: 形如 0427。用户抢到就要看到这个
        payDeadline:
          type: string
          format: date-time
        serverTime:
          type: string
          format: date-time
          description: 服务端当前时间，前端用它算付款倒计时的偏移
    OrderStatus:
      type: string
