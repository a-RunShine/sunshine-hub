openapi: 3.1.0
info:
  title: Sunshine-FPS
  version: 1.0.0
  description: |
    虚构 FPS 游戏官方商城的 HTTP 契约。前端从这里生成类型，后端照着它实现，MSW 的 handler 照它造数据。

    错误分两层。HTTP 状态码表达类别，给网关、监控和前端拦截器用：400 参数、401 未登录、403 无权限、404 不存在、409 状态冲突、410 已售罄、429 限流、500 服务端错。响应体的 code 表达具体原因，给前端做分支和文案。

    只用一层不够：光靠状态码分不清「已购买」和「订单已关闭」，都是 409；光靠业务码，网关看不出限流和 5xx。

    时间统一用 ISO 8601 带时区。倒计时相关接口返回 serverTime，前端拿它与本地时间算偏移。

    认证用 SESSION cookie，会话存在 Redis，登出和封号都是一次 DEL。
servers:
  - url: http://localhost:8080/api
    description: 本地开发
tags:
  - name: identity
    description: 注册、登录、实名
  - name: catalog
    description: 商品与售卖活动
  - name: trade
    description: 抢购、下单、支付、履约、退款
  - name: content
    description: 公告与运营活动
  - name: admin
    description: 运营管理，需要管理员身份
security:
  - session: []
paths:
  /auth/register:
    post:
      tags: [identity]
      summary: 注册
      description: 只要用户名和密码，实名不在这里采集。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 32
                  pattern: '^[a-zA-Z0-9_]+$'
                password:
                  type: string
                  minLength: 8
                  maxLength: 64
      responses:
        '201':
          description: 注册成功并进入登录态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '409':
          description: 用户名已被占用。code：USERNAME_TAKEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      tags: [identity]
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: 登录成功，Set-Cookie 下发 SESSION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: 用户名或密码不对。code：BAD_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      tags: [identity]
      summary: 登出
      responses:
        '204':
          description: 会话已从 Redis 删除
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      tags: [identity]
      summary: 当前登录用户
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/real-name:
    put:
      tags: [identity]
      summary: 提交实名
      description: 抢购前必须完成，已生效的实名不可修改。姓名存明文，证件号只存 hash 与后四位。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [realName, idNumber]
              properties:
                realName:
                  type: string
                  maxLength: 32
                idNumber:
                  type: string
                  pattern: '^\d{17}[\dXx]$'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '409':
          description: 已实名，不允许覆盖。code：REAL_NAME_ALREADY_SET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /products:
    get:
      tags: [catalog]
      summary: 商品列表
      security: []
      parameters:
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/ProductKind'
        - name: categoryId
          in: query
          description: 按所属分类筛选；与 kind 同时出现时为 AND 组合。参数名与分类资源标识一致。
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /products/{productId}:
    get:
      tags: [catalog]
      summary: 商品详情
      description: 缓存击穿与穿透的防护点。不存在的 ID 返回 404，服务端会缓存空标记。
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          description: 商品不存在。code：PRODUCT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /categories:
    get:
      tags: [catalog]
      summary: 分类列表
      description: 分类由运营维护，加分类不需要改契约。不分页，直接返回数组，按 sortOrder 升序。
      security: []
      responses:
        '200':
          description: 按 sortOrder 升序
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /campaigns/upcoming:
    get:
      tags: [catalog]
      summary: 即将开售的场次
      security: []
      responses:
        '200':
          description: 按开售时间升序
          content:
            application/json:
              schema:
                type: object
                required: [items, serverTime]
                properties:
                  serverTime:
                    type: string
                    format: date-time
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CampaignSummary'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /campaigns/{campaignId}:
    get:
      tags: [catalog]
      summary: 场次详情
      description: 含实时剩余份数与服务端时间，供前端校准倒计时。
      security: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
        '404':
          description: 场次不存在。code：CAMPAIGN_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /campaigns/{campaignId}/claim:
    post:
      tags: [trade]
      summary: 抢购
      description: 原子完成扣配额、校验限购、分配编号。未实名 403；已购买、场次未开售、已结束，或本商品处于购买冷却期返回 409；售罄返回 410；编号池与配额不同步或服务内部错误返回 500。
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '201':
          description: 抢到了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 未实名，需要先调 /me/real-name。code：REAL_NAME_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 已购买过这件商品，或场次未开售、已结束，或本商品处于购买冷却期（到期自动恢复）。冷却按商品计、跨场生效，同一商品在普通售卖与折扣场的直接下单路径上同样拦截。code：ALREADY_PURCHASED、CAMPAIGN_NOT_STARTED、CAMPAIGN_ENDED、PURCHASE_COOLDOWN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: 已售罄。code：SOLD_OUT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 编号池与配额不同步，或服务内部错误。code：UNIT_POOL_INCONSISTENT、INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /campaigns/{campaignId}/reserve:
    post:
      tags: [trade]
      summary: 预约
      description: 开售前 10 分钟收到站内提醒，不占库存，不影响购买顺序。
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '204':
          description: 已预约
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [trade]
      summary: 取消预约
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '204':
          description: 已取消
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders:
    post:
      tags: [trade]
      summary: 直接下单
      description: 用于常规售卖与限时折扣两条直接下单路径。下单前校验同一商品的购买冷却：冷却按 `productId` 计、跨场生效；浏览与预约（`reserved`）不校验冷却。抢购走 /campaigns/{id}/claim，不走这里。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [skuId, quantity]
                    properties:
                      skuId:
                        type: integer
                        format: int64
                      quantity:
                        type: integer
                        minimum: 1
                campaignId:
                  type: integer
                  format: int64
                  description: 限时折扣商品必填，常规售卖不填。订单的 campaign_id 与折扣价都按它确定
                addressId:
                  type: integer
                  format: int64
                  description: 含实体商品时必填
      responses:
        '201':
          description: 下单成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: 参数不合法，或含实体商品但没给地址。code：BAD_REQUEST、ADDRESS_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 库存不足，或本商品处于购买冷却期（到期自动恢复）。常规售卖与限时折扣两条直接下单路径都会校验该商品的冷却；冷却按商品计、跨场生效。code：STOCK_INSUFFICIENT、PURCHASE_COOLDOWN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders/{orderNo}:
    get:
      tags: [trade]
      summary: 订单详情
      description: secondsLeft 由服务端算好，前端不要自己减。
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: 订单不存在。code：ORDER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders/{orderNo}/cancel:
    post:
      tags: [trade]
      summary: 取消未支付订单
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: 订单已支付或已关闭。code：ORDER_NOT_CANCELLABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders/{orderNo}/pay:
    post:
      tags: [trade]
      summary: 发起支付
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      responses:
        '200':
          description: 支付会话已创建
          content:
            application/json:
              schema:
                type: object
                required: [tradeNo, amount, payUrl]
                properties:
                  tradeNo:
                    type: string
                  amount:
                    type: integer
                    format: int64
                  payUrl:
                    type: string
        '409':
          description: 订单已关闭。code：ORDER_NOT_PAYABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /payment/callback:
    post:
      tags: [trade]
      summary: 支付回调
      description: 按 tradeNo 幂等，重复回调返回成功但不重复发货。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tradeNo, status]
              properties:
                tradeNo:
                  type: string
                status:
                  type: string
                  enum: [SUCCESS, FAILED]
                paidAt:
                  type: string
                  format: date-time
      responses:
        '200':
          description: 已处理
        '404':
          description: 支付单不存在。code：ORDER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /fulfillments:
    get:
      tags: [trade]
      summary: 我的履约单
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/FulfillmentStatus'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Fulfillment'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /fulfillments/{fulfillmentId}/sign:
    post:
      tags: [trade]
      summary: 确认签收
      description: 仅 PHYSICAL 且 SHIPPED 可签收；虚拟、未发货、已完成拒绝；重复签收幂等成功且不覆盖首次 signedAt。
      parameters:
        - $ref: '#/components/parameters/FulfillmentId'
      responses:
        '200':
          description: 已签收
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fulfillment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 履约单不存在，或不属于当前账号。code：FULFILLMENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 这个履约单现在不能签收：仅实体且已发货可签收，虚拟、未发货、已完成拒绝。code：FULFILLMENT_NOT_SIGNABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /me/items:
    get:
      tags: [trade]
      summary: 我的道具库与藏品
      description: 虚拟道具与限量藏品都在这里，限量藏品带收藏编号。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OwnedItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /addresses:
    get:
      tags: [trade]
      summary: 收货地址列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [trade]
      summary: 新增地址
      description: 第一条地址自动成为默认；默认归属不接受入参，由独立的设默认动作维护。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          description: 参数不合法，或地址数量超过上限（最多 10 条）。code：BAD_REQUEST、ADDRESS_LIMIT_EXCEEDED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /addresses/{addressId}:
    put:
      tags: [trade]
      summary: 编辑收货地址
      description: 编辑后未支付订单的收货信息随之变化（存的是 addressId）；已支付订单有履约单快照，不受影响。
      parameters:
        - $ref: '#/components/parameters/AddressId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 地址不存在，或不属于当前账号。code：ADDRESS_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [trade]
      summary: 删除收货地址
      description: 仍被未支付订单引用，先取消订单或换地址；已支付订单不受影响。
      parameters:
        - $ref: '#/components/parameters/AddressId'
      responses:
        '204':
          description: 已删除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 地址不存在，或不属于当前账号。code：ADDRESS_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 这个地址还被未支付订单使用，先取消订单或换地址。code：ADDRESS_IN_USE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /addresses/{addressId}/default:
    put:
      tags: [trade]
      summary: 设为默认地址
      description: 独立动作，不塞进编辑；任一时刻至多一条默认，设为默认会取消原默认。
      parameters:
        - $ref: '#/components/parameters/AddressId'
      responses:
        '200':
          description: 已设为默认
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 地址不存在，或不属于当前账号。code：ADDRESS_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /refunds:
    post:
      tags: [trade]
      summary: 申请退款
      description: 按履约单申请。虚拟履约单不接受申请，返回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fulfillmentId, reason]
              properties:
                fulfillmentId:
                  type: integer
                  format: int64
                reason:
                  type: string
                  maxLength: 200
      responses:
        '201':
          description: 已提交，等待运营审核
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '409':
          description: 该履约单不可退，或已有未结的退款单。code：REFUND_NOT_ALLOWED、REFUND_ALREADY_OPEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /refunds/{refundNo}:
    get:
      tags: [trade]
      summary: 退款详情
      parameters:
        - name: refundNo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '404':
          description: 退款单不存在。code：REFUND_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /refund/callback:
    post:
      tags: [trade]
      summary: 退款回调
      description: 按 refundNo 幂等，与支付回调对称。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refundNo, status]
              properties:
                refundNo:
                  type: string
                status:
                  type: string
                  enum: [SUCCESS, FAILED]
      responses:
        '200':
          description: 已处理
        '404':
          description: 退款单不存在。code：REFUND_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /announcements:
    get:
      tags: [content]
      summary: 公告列表
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 按发布时间倒序
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnnouncementSummary'
                  page:
                    type: integer
                  size:
