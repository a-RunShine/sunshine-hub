name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: 后端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: 编译、测试、格式与静态检查
        run: mvn -B verify

      # 构建绿不代表架构规则跑了。Spring Boot 3.5.3 起的 Surefire 有回归，
      # 字段声明的 @ArchTest 会被静默跳过，报告里 Tests run: 0。
      #
      # 只确认「跑了」，不锁具体条数。规则数会随模块增减，拿数字当约束意味着
      # 每次增删规则都要来同步这里，而加规则时忘了改不会有人提醒。
      # 规则该不该删由 review 判断，不由这个数字判断。
      - name: 核对 ArchUnit 真的执行了
        run: |
          report=target/surefire-reports/com.sunshinefps.ArchitectureTest.txt
          if ! grep -qE "Tests run: [1-9]" "$report"; then
            echo "::error::架构规则一条都没执行，检查 Surefire 版本"
            exit 1
          fi
          grep "Tests run:" "$report"

  frontend:
    name: 前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: 从契约生成类型
        working-directory: web
        run: pnpm gen:types

      - name: 类型检查
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: 单元测试
        working-directory: web
        run: pnpm test

      - name: 构建
        working-directory: web
        run: pnpm build

  contract:
    name: 契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 校验 OpenAPI
        run: npx --yes @redocly/cli@latest lint api/openapi.yaml

      # 只输出候选，不 fail。术语的排除词有合法用法（「库存」是 Stock 的正名，
      # 同时也是 Allocation 的排除词），机械检查判不了，留给人挑。
      - name: 扫术语排除词
        run: ./scripts/check-glossary.sh
