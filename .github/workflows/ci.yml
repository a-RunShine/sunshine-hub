name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: 后端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: 编译、测试、格式与静态检查
        run: mvn -B verify

      # 构建绿不代表架构规则跑了。Spring Boot 3.5.3 起的 Surefire 有回归，
      # 字段声明的 @ArchTest 会被静默跳过，报告里 Tests run: 0。
      # 这一步专门核对数字，不是看构建颜色。
      - name: 核对 ArchUnit 真的执行了
        run: |
          count=$(grep -ho "Tests run: [0-9]*" target/surefire-reports/*.txt | grep -o "[0-9]*" | sort -rn | head -1)
          echo "ArchitectureTest 跑了 $count 个用例"
          if [ "$count" -lt 9 ]; then
            echo "::error::架构规则没有全部执行，检查 Surefire 版本"
            exit 1
          fi

  frontend:
    name: 前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: 从契约生成类型
        working-directory: web
        run: pnpm gen:types

      - name: 类型检查
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: 单元测试
        working-directory: web
        run: pnpm test

      - name: 构建
        working-directory: web
        run: pnpm build

  contract:
    name: 契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 校验 OpenAPI
        run: npx --yes @redocly/cli@latest lint api/openapi.yaml
