name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: 后端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: 编译、测试、格式与静态检查
        run: mvn -B verify

      # 构建绿不代表架构规则跑了。Spring Boot 3.5.3 起的 Surefire 有回归，
      # 字段声明的 @ArchTest 会被静默跳过，报告里 Tests run: 0。
      #
      # 只确认「跑了」，不锁具体条数。规则数会随模块增减，拿数字当约束意味着
      # 每次增删规则都要来同步这里，而加规则时忘了改不会有人提醒。
      # 规则该不该删由 review 判断，不由这个数字判断。
      - name: 核对 ArchUnit 真的执行了
        run: |
          report=target/surefire-reports/com.sunshinefps.ArchitectureTest.txt
          if ! grep -qE "Tests run: [1-9]" "$report"; then
            echo "::error::架构规则一条都没执行，检查 Surefire 版本"
            exit 1
          fi
          grep "Tests run:" "$report"

  frontend:
    name: 前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: 从契约生成类型
        working-directory: web
        run: pnpm gen:types

      # 上一步只把类型重新生成到工作区，后面的 tsc 用的是这份新产物，
      # 所以提交里那份过期也照样绿。这一步把它和提交里的那份对起来：
      # 契约是唯一硬依赖，生成物是它的下游，漂移必须在这里红。
      - name: 核对生成类型与提交一致
        working-directory: web
        run: |
          if ! git diff --exit-code -- src/types/api.ts; then
            echo "src/types/api.ts 与 api/openapi.yaml 不一致。"
            echo "跑 pnpm gen:types 并把生成物一起提交。"
            exit 1
          fi

      - name: 类型检查
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: 单元测试
        working-directory: web
        run: pnpm test

      - name: 构建
        working-directory: web
        run: pnpm build

  contract:
    name: 契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 校验 OpenAPI
        run: npx --yes @redocly/cli@latest lint api/openapi.yaml

      # 命中即 fail。只用 node 标准库，不装任何东西——孤儿页检查现成工具都不做，
      # 而 lychee / markdown-link-check 要为此拖进二进制或整套 HTTP 栈。取舍见脚本头注释。
      - name: 扫文档相对链接与 wiki 孤儿页
        run: node scripts/check-doc-links.mjs

      # 只输出候选，不 fail。术语的排除词有合法用法（「库存」是 Stock 的正名，
      # 同时也是 Allocation 的排除词），机械检查判不了，留给人挑。
      - name: 扫术语排除词
        run: ./scripts/check-glossary.sh

      # 上面那条是 advisory，永远不会红，所以脚本自己坏了也不会有人知道。
      # 这条钉住它的行为：命中即 fail。它已经抓出过两个真实缺陷
      # （断言读被 head -3 截断的展示输出、pipefail 下 grep -q 触发 SIGPIPE），
      # 两次都是手工跑才发现的，因为这条测试当时没接进 CI。
      - name: 术语检查脚本的回归测试
        run: ./scripts/test-check-glossary.sh

      # docs-sync 分析器是纯离屏脚本（不联网、不跑 git/gh），行为同样要靠
      # 内置 test runner 钉住；否则脚本坏了只会在 workflow 的 dry-run 日志里露脸。
      - name: 文档同步脚本的回归测试
        run: node --test scripts/docs-sync.test.mjs
