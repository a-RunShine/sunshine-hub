name: 文档同步

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      full:
        description: 首次全量复核（额外扫已合并 PR 正文与全仓文档）
        type: boolean
        default: false

concurrency:
  group: docs-sync-main
  cancel-in-progress: false

jobs:
  docs-sync:
    name: 文档同步
    # 只复核合进 main 的 PR；docs/sync-* 是本流程自己开出的分支，回灌会形成自激循环
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && !startsWith(github.event.pull_request.head.ref, 'docs/sync-'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
      FULL: ${{ inputs.full }}
    steps:
      - name: 检出 main 完整历史
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # 默认 GITHUB_TOKEN 推的分支不会再触发 workflow；docs PR 要能跑 CI，检出与推送都走 PAT
          token: ${{ secrets.DOCS_SYNC_TOKEN }}

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # git 本身不读 GH_TOKEN；把 gh 配成凭据助手，推送时才走 PAT，token 不进 remote URL
      - name: 配置 git 走 gh 凭据助手
        run: gh auth setup-git

      # 渲染器与 shell 辅助函数只写一份，后面所有步骤共用；避免加参数或改正文只改到一半
      - name: 生成辅助脚本与 PR 正文渲染器
        run: |
          set -euo pipefail
          mkdir -p .docs-sync-run

          cat > .docs-sync-run/step-helpers.sh <<'HELPERS'
          # 被各步骤 source；FULL 由 job env 提供。

          # 组装 docs-sync.mjs 参数；$1 = dry-run | apply
          build_args() {
            local mode="$1"
            ARGS=(--main-sha "$(cat .docs-sync-run/main-sha)"
              --issues .docs-sync-run/issues.json
              --prs .docs-sync-run/prs.json
              --issue-states .docs-sync-run/issue-states.json
              --git-shas .docs-sync-run/git-shas.txt)
            if [ "$FULL" = "true" ]; then
              ARGS+=(--full --merged-prs .docs-sync-run/merged-prs.json)
            fi
            if [ -s .docs-sync-run/trigger-pr ]; then
              ARGS+=(--trigger-pr "$(cat .docs-sync-run/trigger-pr)")
            fi
            if [ -s .docs-sync-run/trigger-pr-body.txt ]; then
              ARGS+=(--trigger-pr-body .docs-sync-run/trigger-pr-body.txt)
            fi
            if [ "$mode" = "apply" ]; then
              ARGS+=(--issue-states-cmd 'gh issue list --state all --json number,state' --poll-closes 120000)
            fi
          }

          # 找到同名 OPEN 滚动 issue 编号；找不到输出空串
          find_rolling_issue() {
            gh issue list --state open --json number,title \
              --jq '.[] | select(.title == "docs: 文档同步待人工判断") | .number' | head -n1
          }

          # 评论正文字节数兜底：渲染器已按预算收敛，这里再核一次；仍超就硬截断并补说明，
          # 保证 comment 发得出去——老 issue 正文不许整段重写，评论也有上限
          guard_section() {
            local file="$1" max="$2"
            [ -s "$file" ] || return 0
            local size note noteBytes tmp
            size=$(wc -c < "$file")
            if [ "$size" -le "$max" ]; then return 0; fi
            note='> 已截断：完整清单见 run artifact。'
            noteBytes=$(printf '%s' "$note" | wc -c)
            head -c "$((max - noteBytes))" "$file" > "$file.tmp"
            printf '%s\n' "$note" >> "$file.tmp"
            mv "$file.tmp" "$file"
          }
          HELPERS

          cat > .docs-sync-run/render-pr-body.mjs <<'MJS'
          import fs from 'node:fs';
          const dir = '.docs-sync-run/';
          const plan = JSON.parse(fs.readFileSync(dir + 'plan.json', 'utf8'));
          const dry = JSON.parse(fs.readFileSync(dir + 'dry-run.json', 'utf8'));
          const read = n => fs.existsSync(dir + n) ? fs.readFileSync(dir + n, 'utf8').trim() : '';
          const issueNumber = read('issue-number');
          const diffStat = read('diff-stat.txt');
          const triggerDesc = read('trigger-desc');
          const s = plan.summary;
          const lines = [];
          lines.push('## Summary');
          lines.push(`- 触发：${triggerDesc}`);
          lines.push(`- 检查：${s.pass} pass / ${s.drift} drift / ${s.report} report`);
          lines.push('- 改动：');
          for (const f of plan.changedFiles) lines.push(`  - ${f}`);
          lines.push('');
          lines.push('## Evidence');
          lines.push('### 九项检查结果');
          lines.push('');
          lines.push('| # | 检查 | 状态 | 发现数 |');
          lines.push('| --- | --- | --- | --- |');
          for (const c of plan.checks) {
            lines.push(`| ${c.id} | ${c.title} | ${c.status} | ${c.findings.length} |`);
          }
          lines.push('');
          lines.push('### `git diff --stat main..HEAD`');
          lines.push('');
          lines.push('```');
          lines.push(diffStat || '（无 diff）');
          lines.push('```');
          lines.push('');
          lines.push('### 逐条自动修正');
          if (plan.fixes.length === 0) lines.push('- （无）');
          for (const fx of plan.fixes) {
            lines.push(`- \`${fx.file}:${fx.line}\`（${fx.kind}）`);
            lines.push(`  - before: ${fx.before}`);
            lines.push(`  - after: ${fx.after}`);
          }
          lines.push('');
          lines.push('### dry-run 摘要');
          lines.push('');
          lines.push(`dry-run：${dry.summary.pass} pass / ${dry.summary.drift} drift / ${dry.summary.report} report`);
          lines.push('');
          lines.push('## Merge Danger');
          lines.push('双向门：只改文档事实，历史断言未改写，只追加带日期的更正。回滚 = revert 本 PR。');
          if (issueNumber) lines.push(`关联滚动 issue：#${issueNumber}`);
          fs.writeFileSync(dir + 'pr-body.md', lines.join('\n') + '\n');
          MJS

      - name: 采集 issue、PR 与 git 历史事实
        run: |
          set -euo pipefail
          echo "采集 issue/PR/git 历史事实" > .docs-sync-run/stage
          {
            gh issue list --state open --json number,title,state,labels,updatedAt > .docs-sync-run/issues.json
            gh pr list --state open --json number,title,body,headRefName,reviewDecision,createdAt > .docs-sync-run/prs.json
            gh issue list --state all --json number,state > .docs-sync-run/issue-states.json
            git log --all --format=%H > .docs-sync-run/git-shas.txt
            echo "${{ github.event_name }}" > .docs-sync-run/event-name
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "${{ github.event.pull_request.number }}" > .docs-sync-run/trigger-pr
              echo "${{ github.event.pull_request.merge_commit_sha }}" > .docs-sync-run/trigger-merged-sha
              gh pr view "${{ github.event.pull_request.number }}" --json body --jq .body > .docs-sync-run/trigger-pr-body.txt
            else
              : > .docs-sync-run/trigger-pr
              rm -f .docs-sync-run/trigger-pr-body.txt .docs-sync-run/trigger-merged-sha
            fi
            if [ "$FULL" = "true" ]; then
              gh pr list --state merged --search "merged:>=$(date -u -d '90 days ago' +%F)" \
                --json number,title,body,headRefName,mergedAt > .docs-sync-run/merged-prs.json
            else
              echo '[]' > .docs-sync-run/merged-prs.json
            fi
            # 标注用实际被分析的树（HEAD），不用触发 PR 的 merge_commit_sha：并发串行下 main 头可能已前进
            git rev-parse HEAD > .docs-sync-run/main-sha
          } 2> .docs-sync-run/err-collect.log

      - name: 干跑复核并留存九项结果
        run: |
          set -euo pipefail
          source .docs-sync-run/step-helpers.sh
          echo "干跑复核" > .docs-sync-run/stage
          if [ "$(cat .docs-sync-run/event-name)" = "pull_request" ]; then
            echo "PR #$(cat .docs-sync-run/trigger-pr) 合并 $(cat .docs-sync-run/trigger-merged-sha)" > .docs-sync-run/trigger-desc
          elif [ "$FULL" = "true" ]; then
            echo "workflow_dispatch 全量复核" > .docs-sync-run/trigger-desc
          else
            echo "workflow_dispatch 增量复核" > .docs-sync-run/trigger-desc
          fi

          # dry-run 不等待、不重读 issue 状态：只用首帧快照，poll 退化为一次比较
          build_args dry-run
          { node scripts/docs-sync.mjs --dry-run "${ARGS[@]}" --plan-out .docs-sync-run/dry-run.json; } 2> .docs-sync-run/err-dry-run.log

      - name: 落盘修正并产出 plan
        run: |
          set -euo pipefail
          source .docs-sync-run/step-helpers.sh
          echo "落盘修正" > .docs-sync-run/stage
          build_args apply
          { node scripts/docs-sync.mjs --apply "${ARGS[@]}" --plan-out .docs-sync-run/plan.json; } 2> .docs-sync-run/err-apply.log

      - name: 按 plan 建分支、提交并开或更新 docs PR
        run: |
          set -euo pipefail
          source .docs-sync-run/step-helpers.sh
          echo "建分支、提交并开/更新 docs PR" > .docs-sync-run/stage
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync('.docs-sync-run/plan.json', 'utf8'));
          const out = '.docs-sync-run/';
          fs.writeFileSync(out + 'fixes-count', String(plan.fixes.length));
          fs.writeFileSync(out + 'reports-count', String(plan.reports.length));
          fs.writeFileSync(out + 'branch', plan.plan.branch ?? '');
          fs.writeFileSync(out + 'commit-msg', plan.plan.commitMessage ?? '');
          fs.writeFileSync(out + 'reuse-pr', plan.plan.reuseExistingPr ? String(plan.plan.reuseExistingPr.number) : '');
          fs.writeFileSync(out + 'changed-files.json', JSON.stringify(plan.changedFiles ?? []));
          EOF
          if [ "$(cat .docs-sync-run/fixes-count)" = "0" ]; then
            echo "无自动修正：不建分支、不开 PR。"
            exit 0
          fi

          BRANCH="$(cat .docs-sync-run/branch)"
          COMMIT_MSG="$(cat .docs-sync-run/commit-msg)"
          REUSE_PR="$(cat .docs-sync-run/reuse-pr)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$REUSE_PR" ]; then
            # 复用前先确认 PR 仍 OPEN：已合并/关闭的 PR 再推提交不会进 main
            ./scripts/pr-preflight.sh "$REUSE_PR"
            git fetch origin "$BRANCH"
            git switch -C "$BRANCH" "origin/$BRANCH"
          else
            git fetch origin "$BRANCH" || true
            if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
              # 同一 sha 重跑时远端分支已存在：切回去复用，仍不 force push
              git switch -C "$BRANCH" "origin/$BRANCH"
            else
              git switch -c "$BRANCH"
            fi
          fi

          mapfile -t FILES < <(node --input-type=module -e '
            import fs from "node:fs";
            const p = JSON.parse(fs.readFileSync(".docs-sync-run/changed-files.json", "utf8"));
            p.forEach(f => console.log(f));
          ')
          git add -- "${FILES[@]}"
          # 重跑可能没有新增改动：空索引直接退出，不产生空提交
          if git diff --cached --quiet; then
            echo "无新增改动，退出。"
            exit 0
          fi
          git commit -m "$COMMIT_MSG"

          git diff --stat main..HEAD > .docs-sync-run/diff-stat.txt

          # 提交只存在于本 runner 的工作区。gh pr create 比的是远端，不 push 就只会得到
          # 「No commits between main and <branch>」——这条以前漏过，一次 full 跑白费。
          git push origin "$BRANCH"
          # 推完核一次远端真有这个分支：push 静默没成时，宁可在这里红，也不要拿一个
          # 不存在的 head 去开 PR。--exit-code 让「没匹配到」变成非零退出。
          git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null

          # issue 编号此时还没拿到，先留空；双向链接在滚动 issue 步骤补回来
          : > .docs-sync-run/issue-number
          node .docs-sync-run/render-pr-body.mjs

          if [ -n "$REUSE_PR" ]; then
            ./scripts/pr-preflight.sh "$REUSE_PR"
            gh pr edit "$REUSE_PR" --body-file .docs-sync-run/pr-body.md
            echo "$REUSE_PR" > .docs-sync-run/pr-number
          else
            gh pr create --base main --head "$BRANCH" --title "$COMMIT_MSG" \
              --body-file .docs-sync-run/pr-body.md
            gh pr list --head "$BRANCH" --json number --jq '.[0].number' > .docs-sync-run/pr-number
          fi

      - name: 按 plan 追加滚动 docs issue
        run: |
          set -euo pipefail
          source .docs-sync-run/step-helpers.sh
          echo "追加滚动 docs issue" > .docs-sync-run/stage
          if [ "$(cat .docs-sync-run/reports-count)" = "0" ]; then
            echo "无待人工判断项：不开 issue、不发评论。"
            exit 0
          fi

          PR_NUMBER="$(cat .docs-sync-run/pr-number 2>/dev/null || true)"
          ARTIFACT="docs-sync-${{ github.run_id }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PR_ARG=()
          if [ -n "$PR_NUMBER" ]; then PR_ARG=(--pr "$PR_NUMBER"); fi

          # 报告节由离屏纯函数渲染：同行合并、按文件分组、预算内收敛；渲染失败只丢本节内容，
          # plan 仍随 artifact 留存，不让整个 job 红
          if ! node scripts/docs-sync-report.mjs \
            --plan .docs-sync-run/plan.json --out .docs-sync-run/issue-section.md \
            --max-chars 60000 --per-file 10 \
            --run-url "$RUN_URL" --artifact "$ARTIFACT" "${PR_ARG[@]}"; then
            echo "报告节渲染失败：跳过评论。"
            exit 0
          fi
          guard_section .docs-sync-run/issue-section.md 60000

          cat > .docs-sync-run/issue-body-stub.md <<'STUB'
          本 issue 收集 docs-sync 待人工判断项，逐次复核以评论追加；完整清单见对应 run 的 artifact。
          STUB

          ISSUE_NUMBER="$(find_rolling_issue)"
          if [ -n "$ISSUE_NUMBER" ]; then
            # 老 issue 只追加评论，绝不整段重写正文（#62 正文已被撑大过一次）
            gh issue comment "$ISSUE_NUMBER" --body-file .docs-sync-run/issue-section.md
          else
            gh issue create --title "docs: 文档同步待人工判断" --label docs \
              --body-file .docs-sync-run/issue-body-stub.md
            ISSUE_NUMBER="$(find_rolling_issue)"
            gh issue comment "$ISSUE_NUMBER" --body-file .docs-sync-run/issue-section.md
          fi
          echo "$ISSUE_NUMBER" > .docs-sync-run/issue-number

          # 双向链：issue 已链 PR，回头把 issue 编号补进 PR 正文
          if [ -n "${PR_NUMBER:-}" ]; then
            node .docs-sync-run/render-pr-body.mjs
            ./scripts/pr-preflight.sh "$PR_NUMBER"
            gh pr edit "$PR_NUMBER" --body-file .docs-sync-run/pr-body.md
          fi

      # 失败记录尽力而为：原始失败结论已经成立，这一步再坏也不覆盖它
      - name: 追加失败记录到滚动 issue
        if: failure()
        continue-on-error: true
        run: |
          set -u
          source .docs-sync-run/step-helpers.sh
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STAGE="$(cat .docs-sync-run/stage 2>/dev/null || echo 未知环节)"
          MAIN_SHA="$(cat .docs-sync-run/main-sha 2>/dev/null || echo unknown)"
          TODAY="$(date -u +%F)"
          # 取阶段顺序里最后一个非空 stderr 日志
          TAIL="（没有捕获到 stderr）"
          for f in err-collect.log err-dry-run.log err-apply.log; do
            if [ -s ".docs-sync-run/$f" ]; then
              TAIL="$(tail -n 20 ".docs-sync-run/$f")"
            fi
          done
          export RUN_URL TODAY STAGE MAIN_SHA TAIL

          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const dir = '.docs-sync-run/';
          const runUrl = process.env.RUN_URL;
          const today = process.env.TODAY;
          const stage = process.env.STAGE;
          const mainSha = process.env.MAIN_SHA;
          const tail = process.env.TAIL;
          const out = [];
          out.push(`## ${today} 复核（\`${mainSha}\`）— 流程失败`);
          out.push('');
          out.push(`- Run：${runUrl}`);
          out.push(`- 失败环节：${stage}`);
          out.push('- stderr 末 20 行：');
          out.push('');
          out.push('```');
          out.push(tail);
          out.push('```');
          fs.writeFileSync(dir + 'failure-section.md', out.join('\n') + '\n');
          EOF

          guard_section .docs-sync-run/failure-section.md 60000

          cat > .docs-sync-run/issue-body-stub.md <<'STUB'
          本 issue 收集 docs-sync 待人工判断项，逐次复核以评论追加；完整清单见对应 run 的 artifact。
          STUB

          ISSUE_NUMBER="$(find_rolling_issue || true)"
          if [ -n "$ISSUE_NUMBER" ]; then
            # 失败记录同样只追加评论，不重写老 issue 正文
            gh issue comment "$ISSUE_NUMBER" --body-file .docs-sync-run/failure-section.md
          else
            gh issue create --title "docs: 文档同步待人工判断" --label docs \
              --body-file .docs-sync-run/issue-body-stub.md
            ISSUE_NUMBER="$(find_rolling_issue || true)"
            [ -n "$ISSUE_NUMBER" ] && gh issue comment "$ISSUE_NUMBER" --body-file .docs-sync-run/failure-section.md
          fi

      # 完整清单的落点：无论成功失败都留存 plan 与报告节；上传失败不覆盖原始结论
      - name: 上传本轮 plan 与报告节作为 artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: docs-sync-${{ github.run_id }}
          path: |
            .docs-sync-run/plan.json
            .docs-sync-run/issue-section.md
            .docs-sync-run/failure-section.md
          if-no-files-found: warn
