<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 264" width="680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>商品与售卖层</title>
  <desc>Product 商品下挂 Sku 规格承载库存；Product 参与 Campaign 售卖活动，Campaign 分限时抢购、常规售卖、限时折扣三种；只有限时抢购才有 Allocation 配额。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="50" width="180" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="60" y="74" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#26215C" dominant-baseline="central">Product 商品</text>
  <text x="60" y="94" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#534AB7" dominant-baseline="central">虚拟道具 / 实体周边</text>

  <rect x="280" y="50" width="170" height="64" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="300" y="74" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#26215C" dominant-baseline="central">Sku 规格</text>
  <text x="300" y="94" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#534AB7" dominant-baseline="central">库存挂在这一层</text>

  <rect x="40" y="180" width="180" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="60" y="204" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#042C53" dominant-baseline="central">Campaign 售卖活动</text>
  <text x="60" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#185FA5" dominant-baseline="central">抢购 / 常规 / 折扣</text>

  <rect x="280" y="180" width="170" height="64" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="300" y="204" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#042C53" dominant-baseline="central">Allocation 配额</text>
  <text x="300" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#185FA5" dominant-baseline="central">这一场的份数</text>

  <path d="M220 82 L276 82" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="248" y="70" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">1 : N</text>

  <path d="M130 114 L130 176" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="142" y="146" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" dominant-baseline="central">1 : N</text>

  <path d="M220 212 L276 212" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="248" y="200" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">仅抢购</text>
</svg>
