<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 260" width="680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>交易与履约层</title>
  <desc>Purchaser 购买人通过多个 Account 账号下单；Order 订单只管钱，按商品形态拆成 Fulfillment 履约单；履约完成后限量商品的 Unit 物件归属确立。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="50" width="150" height="60" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="58" y="72" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#042C53" dominant-baseline="central">Purchaser 购买人</text>
  <text x="58" y="92" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#185FA5" dominant-baseline="central">实名指纹 · 限购主体</text>

  <rect x="220" y="50" width="150" height="60" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="238" y="72" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#042C53" dominant-baseline="central">Account 账号</text>
  <text x="238" y="92" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#185FA5" dominant-baseline="central">一人可持有多个</text>

  <rect x="410" y="50" width="190" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="428" y="72" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#26215C" dominant-baseline="central">Order 订单</text>
  <text x="428" y="92" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#534AB7" dominant-baseline="central">只管钱，不管货</text>

  <rect x="410" y="180" width="190" height="60" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="428" y="202" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#26215C" dominant-baseline="central">Fulfillment 履约单</text>
  <text x="428" y="222" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#534AB7" dominant-baseline="central">虚拟即完成，实体走发货</text>

  <rect x="190" y="180" width="190" height="60" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="208" y="202" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#26215C" dominant-baseline="central">Unit 物件</text>
  <text x="208" y="222" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#534AB7" dominant-baseline="central">限量商品的唯一实例</text>

  <path d="M190 80 L216 80" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="203" y="66" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">1 : N</text>

  <path d="M370 80 L406 80" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M505 110 L505 176" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="517" y="143" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" dominant-baseline="central">1 : N</text>

  <path d="M406 210 L384 210" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
