brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 开发环境自动建 topic 和消费组，省掉手工创建这一步
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 容器内直接监听映射出来的端口，注册到 namesrv 的地址就是宿主机能连上的地址。
# 这一行不设对，客户端会拿到容器内网 IP，连不上。
brokerIP1 = 127.0.0.1
listenPort = 30911
